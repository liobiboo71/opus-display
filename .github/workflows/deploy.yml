name: Publier l affichage open space

on:
  push:
    branches: [main]
    paths: [index.html, envoyer.html, message.mjs, package.json, messages.json, planning.py, config.json, .github/workflows/deploy.yml]
  schedule:
    - cron: "30 6 * * 1-5"    # apres la synchro PayFit de 6h UTC (7h30 Paris l'hiver)
    - cron: "30 11 * * 1-5"   # mise a jour de la mi-journee
  workflow_dispatch:

env:
  SITE_URL: https://superb-genie-9cda0e.netlify.app

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparer le dossier a publier
        run: |
          mkdir public
          cp index.html envoyer.html messages.json public/

      - name: Preparer la fonction d envoi de messages
        env:
          MESSAGE_PIN: ${{ secrets.MESSAGE_PIN }}
        run: |
          mkdir fonctions
          cp message.mjs fonctions/
          node -e 'require("fs").writeFileSync("fonctions/pin.mjs", "export default " + JSON.stringify(process.env.MESSAGE_PIN || "") + ";\n")'
          npm install --omit=dev --no-audit --no-fund

      - name: Generer le planning depuis OOTI
        id: planning
        continue-on-error: true
        env:
          OOTI_USER: ${{ secrets.OOTI_USER }}
          OOTI_PASSWORD: ${{ secrets.OOTI_PASSWORD }}
        run: python3 planning.py --sortie public/planning.json

      - name: Si OOTI a echoue, reprendre le dernier planning publie
        if: steps.planning.outcome == 'failure'
        run: curl -fsS "$SITE_URL/planning.json" -o public/planning.json || echo "Pas de planning precedent."

      - name: Publier sur Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@latest deploy --dir=public --functions=fonctions --prod --no-build --message "GitHub Actions ${{ github.sha }}"

      - name: Signaler l'echec du planning (e-mail GitHub)
        if: steps.planning.outcome == 'failure'
        run: |
          echo "::error::Le planning OOTI n a pas pu etre genere. Le site a ete publie avec le dernier planning connu."
          exit 1
